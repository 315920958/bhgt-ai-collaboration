<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>境界管理 · 宋式仙册</title>
<link rel="stylesheet" href="../../design-tokens.css">
<style>
  body{padding:28px 36px;}
  /* 页面内容内层 .page 不再依赖 demo 的 display 切换, 直接显示 */
  .page{display:block !important;min-height:auto;}
</style>
</head>
<body>
<div class="page active">
  <div class="page-header"><div><h2>境界管理</h2><div class="sub">境界基础配置 + 突破后配置</div></div><button class="btn btn-primary btn-sm">+ 新增境界</button></div>
  <table class="admin-table">
    <thead><tr><th>等级</th><th>境界名称</th><th>说明</th><th>突破寿元增加</th><th>可分配属性点</th><th>单项上限</th><th>操作</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>炼气一层</td><td>初入修仙</td><td>+10</td><td>—</td><td>—</td><td><button class="btn-text btn">编辑</button></td></tr>
      <tr><td>2</td><td>炼气二层</td><td>灵力初凝</td><td>+10</td><td>—</td><td>—</td><td><button class="btn-text btn">编辑</button></td></tr>
      <tr><td>3</td><td>炼气三层</td><td>灵力成旋</td><td>+10</td><td>3</td><td>2</td><td><button class="btn-text btn">编辑</button></td></tr>
      <tr><td>4</td><td>筑基初期</td><td>筑基之始</td><td>+20</td><td>5</td><td>3</td><td><button class="btn-text btn">编辑</button></td></tr>
      <tr><td>5</td><td>筑基中期</td><td>根基渐稳</td><td>+20</td><td>5</td><td>3</td><td><button class="btn-text btn">编辑</button></td></tr>
      <tr><td>6</td><td>金丹初期</td><td>结丹之相</td><td>+30</td><td>8</td><td>4</td><td><button class="btn-text btn">编辑</button></td></tr>
    </tbody>
  </table>
  <div class="divider"><span>突破后配置说明</span></div>
  <div class="card">
    <div class="text-sm text-grey">突破后寿元增加：可填固定值或随机区间（如 10~20）。可分配属性点留空时表示该境界突破不分配属性点。</div>
  </div>
</div>
</body>
</html>

# AI-Anchor V2 HTTPS reverse proxy
# HTTP: redirect all traffic to HTTPS
server {
    listen 80;
    server_name sixonehub.site www.sixonehub.site;

    return 301 https://$host$request_uri;
}

# HTTPS: terminate SSL and proxy to AI-Anchor V2 on localhost:3001
server {
    listen 443 ssl;
    server_name sixonehub.site www.sixonehub.site;

    ssl_certificate /etc/nginx/ssl_files/www.sixonehub.site_nginx/www.sixonehub.site_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl_files/www.sixonehub.site_nginx/www.sixonehub.site.key;

    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    location = /WfVuEvCIW9.txt {
        alias /var/www/ai-anchor-wechat-verify/WfVuEvCIW9.txt;
        default_type text/plain;
    }

    # ===== BHGT TapTap OAuth 回调（test 环境专用，2026-08-07 新增）=====
    # 精确匹配，仅拦截 /api/auth/taptap/callback；其它请求照旧走 location / 转给 AI-Anchor V2
    location = /api/auth/taptap/callback {
        return 302 $arg_state?code=$arg_code;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support Next.js websocket / upgrade behavior when needed.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

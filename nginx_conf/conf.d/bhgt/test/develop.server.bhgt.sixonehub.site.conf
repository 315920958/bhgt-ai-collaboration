server {
    listen 80;
    server_name develop.server.bhgt.sixonehub.site;

    # 测试环境保留 HTTP：供本地浏览器与无需 TLS 的联调使用。
    # TapTap 测试包仍应使用下方 HTTPS 地址（平台 request 白名单要求 HTTPS）。
    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name develop.server.bhgt.sixonehub.site;

    ssl_certificate /etc/nginx/ssl_files/develop.server.bhgt.sixonehub.site_nginx/develop.server.bhgt.sixonehub.site_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl_files/develop.server.bhgt.sixonehub.site_nginx/develop.server.bhgt.sixonehub.site.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

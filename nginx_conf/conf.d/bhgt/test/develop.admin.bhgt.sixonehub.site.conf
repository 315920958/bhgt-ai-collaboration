server {
    listen 80;
    server_name develop.admin.bhgt.sixonehub.site;

    root /opt/apps/bhgt/test/admin/dist;
    index index.html;

    # Vue/React history mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|webp|json)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

#!/usr/bin/env bash
# ============================================================
# Nginx 配置同步 —— 远端连接与路径配置（被 pull/push 脚本 source）
# 服务器与 bhgt-ai-collaboration/scripts/tunnel-mongo.sh 保持一致
# ============================================================

# 远端服务器 SSH 目标（用户@主机）
REMOTE_USER_HOST="ubuntu@49.232.103.103"

# SSH 端口（默认 22；如用私钥，下方 SSH_OPTS 里加 -i /path/to/key）
REMOTE_PORT="22"

# 远端 nginx 配置根目录（属 root，需 sudo 读写）
REMOTE_NGINX_DIR="/etc/nginx"

# 要同步的配置项（相对 REMOTE_NGINX_DIR）
#   - 以 "/" 结尾 = 目录：把目录「内容」同步进本地同名目录
#   - 不带 "/"  = 文件：整体同步
# 注意：只同步「配置」，不碰 ssl_files / 日志等运行时数据
#       如后续要同步更多，直接往这里加，例如 "sites-enabled/" "snippets/"
REMOTE_PATHS=( "conf.d/" "nginx.conf" )

# 远端 rsync 以 sudo 运行，以便读写 root 拥有的 /etc/nginx
RSYNC_PATH="sudo rsync"

# 派生：SSH 连接参数（脚本内部使用）
SSH_OPTS="-p ${REMOTE_PORT}"
